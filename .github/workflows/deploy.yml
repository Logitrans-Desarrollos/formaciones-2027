name: Publicar en GitHub Pages

# Se ejecuta automáticamente cada vez que subes cambios a "main".
# Todo el proceso (npm install + npm run build) corre en los servidores
# de GitHub, no en tu computador — por eso no necesitas Node.js instalado
# localmente para publicar el sitio.
on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo manualmente desde la pestaña "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el proyecto (npm run build)
        run: npm run build
        env:
          # Token de GitHub (permiso solo de "Contents" en este repo) usado
          # para registrar quién completó el curso. Se configura como
          # "Repository secret" en Settings > Secrets and variables >
          # Actions, NUNCA se escribe en el código fuente. Vite lo incrusta
          # en el JavaScript compilado (por eso el token debe estar limitado
          # solo a este repositorio, como ya se acordó).
          VITE_GITHUB_WRITE_TOKEN: ${{ secrets.VITE_GITHUB_WRITE_TOKEN }}

      - name: Preparar el sitio para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
